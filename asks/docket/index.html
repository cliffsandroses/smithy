<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docket</title>
<style>
:root{--bg:#0e1013;--card:#16191e;--line:#262b33;--tx:#e6e8ec;--mut:#9aa3af;--acc:#7aa2f7;--warn:#e0af68;--ok:#7bc96f;--blk:#f7768e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:#0e1013f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:17px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
h1 small{font-weight:400;color:var(--mut);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx);background:#1b1f26;border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button[aria-pressed=true]{background:var(--acc);color:#0b0d10;border-color:var(--acc);font-weight:600}
input[type=search]{min-width:200px;flex:1}
main{padding:14px;max-width:1000px;margin:0 auto}
.ask{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.ask.wait{border-left-color:var(--warn)}.ask.todo{border-left-color:var(--acc)}.ask.done{border-left-color:var(--ok)}
.ask h3{margin:0;font-size:15px}
.meta{color:var(--mut);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin:3px 0 8px}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk>li{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.cb{width:18px;height:18px;flex:0 0 18px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:12px;margin-top:2px}
.cb.on{background:var(--ok);color:#0b0d10;border-color:var(--ok)}.cb.wait{background:var(--warn);color:#0b0d10;border-color:var(--warn)}.cb.blk{background:var(--blk);color:#0b0d10;border-color:var(--blk)}
.body{flex:1;min-width:0}
.t{display:block;word-break:break-word}
.p{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.p a{color:var(--acc)}
ol.steps{margin:4px 0 0 18px;padding:0;color:var(--mut);font-size:13px}
.acts{display:flex;gap:4px;align-items:flex-start}
.acts button,.acts select{padding:2px 6px;font-size:12px}
.empty{color:var(--mut);padding:20px;text-align:center}
.nx li .where{color:var(--mut);font-size:12px}
.tile{display:inline-flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 12px;min-width:92px}
.tile b{font-size:19px}.tile span{color:var(--mut);font-size:11px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;width:min(560px,94vw)}
dialog h3{margin:0 0 8px}
dialog label{display:block;margin:8px 0 2px;color:var(--mut);font-size:12px}
dialog input,dialog textarea{width:100%}
.save{color:var(--ok);font-size:12px}
</style>
<header class="top">
  <h1>Docket <small id="stat">loading…</small></h1>
  <div class="row" style="margin-bottom:6px">
    <button data-v="next" aria-pressed="true">All next steps</button>
    <button data-v="waiting">Your turn</button>
    <button data-v="open">Open</button>
    <button data-v="blocked">Blocked</button>
    <button data-v="done">Done</button>
    <button data-v="all">Everything</button>
    <button data-v="nosteps">No steps yet</button>
  </div>
  <div class="row">
    <input type="search" id="q" placeholder="search asks, steps, proof">
    <select id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="left">Most left</option></select>
    <button id="newask">+ New ask</button>
    <button id="reload">Reload</button>
  </div>
</header>
<main>
  <div class="row" id="tiles" style="margin-bottom:12px"></div>
  <div id="list"></div>
</main>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link=t=>esc(t).replace(/(https?:\/\/[^\s<)"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const TODO=s=>["open","none",undefined,null,""].includes(s), STATES=["open","waiting","blocked","done","said","chat"];
let D=[], view="next";

async function api(op,body){
  const r=await fetch("/api/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,...body})});
  const j=await r.json(); if(!r.ok||j.error) throw new Error(j.error||r.status); return j;
}
async function load(){
  const r=await fetch("/api/ledger"); const j=await r.json();
  D=j.asks.map(a=>({...a,items:a.items||[]}));
  $("#stat").textContent=`${D.length} asks · ${j.ledger}`;
  draw();
}
const real=a=>a.items.filter(i=>i.s!=="chat");
const rank=a=>{const r=real(a); return r.some(i=>i.s==="waiting")?0:r.some(i=>i.s==="blocked")?1:r.some(i=>TODO(i.s))?2:r.length?4:3};
const head=a=>a.title||((a.text||"Chat").split("\n")[0]).slice(0,96);

function matches(a){
  const q=$("#q").value.trim().toLowerCase();
  if(q){const hay=(a.title+" "+a.text+" "+a.items.map(i=>[i.t,i.p,i.check,(i.steps||[]).join(" ")].join(" ")).join(" ")).toLowerCase();
    if(!hay.includes(q))return false}
  const r=real(a);
  if(view==="all")return true;
  if(view==="nosteps")return r.length===0;
  if(view==="waiting")return r.some(i=>i.s==="waiting");
  if(view==="blocked")return r.some(i=>i.s==="blocked");
  if(view==="done")return r.length&&r.every(i=>i.s==="done"||i.s==="said");
  if(view==="open")return r.some(i=>TODO(i.s));
  return r.some(i=>TODO(i.s)||i.s==="waiting"||i.s==="blocked");  // next
}

function tiles(){
  const all=D.flatMap(a=>real(a));
  const c={waiting:all.filter(i=>i.s==="waiting").length,open:all.filter(i=>TODO(i.s)).length,
    blocked:all.filter(i=>i.s==="blocked").length,done:all.filter(i=>["done","said"].includes(i.s)).length,
    nosteps:D.filter(a=>real(a).length===0).length};
  $("#tiles").innerHTML=[["Your turn",c.waiting],["Open",c.open],["Blocked",c.blocked],["Done",c.done],["Asks with no steps",c.nosteps]]
    .map(([k,v])=>`<span class="tile"><b>${v}</b><span>${k}</span></span>`).join("");
}

function itemRow(a,i,idx){
  const box=i.s==="done"||i.s==="said"?'<span class="cb on">✓</span>':i.s==="waiting"?'<span class="cb wait">!</span>':i.s==="blocked"?'<span class="cb blk">×</span>':'<span class="cb"></span>';
  return `<li data-id="${a.id}" data-i="${idx}">${box}<div class="body">
    <span class="t">${esc(i.t||"(unnamed step)")}</span>
    ${(i.steps&&i.steps.length)?`<ol class="steps">${i.steps.map(s=>`<li>${link(s)}</li>`).join("")}</ol>`:""}
    ${i.check?`<span class="p">Check: ${link(i.check)}</span>`:""}
    ${i.p?`<span class="p">${link(i.p)}</span>`:""}</div>
    <div class="acts">
      <select data-set>${STATES.map(s=>`<option${s===(i.s||"open")?" selected":""}>${s}</option>`).join("")}</select>
      <button data-edit>Edit</button><button data-del>✕</button>
    </div></li>`;
}

function draw(){
  tiles();
  const srt=$("#sort").value, left=a=>real(a).filter(i=>TODO(i.s)||i.s==="waiting"||i.s==="blocked").length;
  const list=D.filter(matches).sort((x,y)=> srt==="old"?String(x.at).localeCompare(String(y.at))
    : srt==="left"?left(y)-left(x) : (rank(x)-rank(y)||String(y.at).localeCompare(String(x.at))));
  if(view==="next"){
    const steps=D.flatMap(a=>real(a).map((i,idx)=>({i,idx,a}))).filter(({i})=>TODO(i.s)||i.s==="waiting"||i.s==="blocked")
      .filter(({a})=>matches(a))
      .sort((p,q)=>{const o={waiting:0,blocked:1};const r=(x)=>o[x.i.s]??2; return r(p)-r(q)||String(p.a.at).localeCompare(String(q.a.at))});
    $("#list").innerHTML=`<div class="ask todo"><h3>All next steps <small style="color:var(--mut);font-weight:400">${steps.length}</small></h3>
      <div class="meta">every unfinished step from every ask, your turn first, oldest first</div>
      <ul class="chk nx">${steps.map(({a,i,idx})=>itemRow(a,i,idx).replace('<div class="body">','<div class="body">'+`<span class="where">${esc(head(a))}</span><br>`)).join("")||'<li>Nothing left.</li>'}</ul></div>`;
    return;
  }
  $("#list").innerHTML=list.length?list.map(a=>{
    const r=real(a), dn=r.filter(i=>["done","said"].includes(i.s)).length, k=rank(a);
    const st=k===0?"wait":k>=3?"done":"todo";
    return `<article class="ask ${st}" data-ask="${a.id}">
      <h3>${esc(head(a))}</h3>
      <div class="meta"><span>${a.at?new Date(a.at).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}</span>
        <span>${esc(a.where||"")}</span><span>${r.length?dn+"/"+r.length+" done":"no steps yet"}</span></div>
      <ul class="chk">${a.items.map((i,idx)=>i.s==="chat"?"":itemRow(a,i,idx)).join("")}</ul>
      <div class="row" style="margin-top:8px"><button data-add>+ Add step</button><button data-askedit>Edit ask</button><button data-askdel>Delete ask</button></div>
      ${a.text?`<details><summary style="color:var(--mut);font-size:12px;cursor:pointer">What was asked</summary><p class="p">${esc(a.text)}</p></details>`:""}
    </article>`}).join(""):'<div class="empty">Nothing with this filter.</div>';
}

function form(title,fields,onok){
  const f=$("#dlgform");
  f.innerHTML=`<h3>${esc(title)}</h3>`+fields.map(x=>`<label>${esc(x.label)}</label>`+
    (x.area?`<textarea name="${x.name}" rows="${x.rows||3}">${esc(x.value||"")}</textarea>`
          :x.opts?`<select name="${x.name}">${x.opts.map(o=>`<option${o===x.value?" selected":""}>${o}</option>`).join("")}</select>`
          :`<input name="${x.name}" value="${esc(x.value||"")}">`)).join("")
    +`<div class="row" style="margin-top:12px"><button value="ok">Save</button><button value="cancel">Cancel</button></div>`;
  $("#dlg").showModal();
  f.onsubmit=null;
  $("#dlg").onclose=async()=>{ if($("#dlg").returnValue!=="ok")return;
    const data={}; new FormData(f).forEach((v,k)=>data[k]=v);
    try{ await onok(data); await load(); }catch(e){ alert("Save failed: "+e.message) } };
}

document.addEventListener("click",async e=>{
  const v=e.target.closest("[data-v]");
  if(v){view=v.dataset.v;document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",String(b===v)));draw();return}
  const li=e.target.closest("li[data-id]"), id=li?.dataset.id, i=li?.dataset.i;
  const ask=D.find(a=>a.id===id), it=ask?.items[i];
  if(e.target.closest("[data-del]")&&confirm("Delete this step?")){await api("item.delete",{id,i});return load()}
  if(e.target.closest("[data-edit]"))
    return form("Edit step",[{label:"Step",name:"t",value:it.t},{label:"Status",name:"s",opts:STATES,value:it.s||"open"},
      {label:"How it is checked",name:"check",value:it.check||""},{label:"Proof / note",name:"p",area:1,value:it.p||""},
      {label:"Sub-steps (one per line)",name:"steps",area:1,value:(it.steps||[]).join("\n")}],
      d=>api("item.patch",{id,i,t:d.t,s:d.s,check:d.check,p:d.p,steps:d.steps.split("\n")}));
  const art=e.target.closest("article[data-ask]"), aid=art?.dataset.ask, A=D.find(a=>a.id===aid);
  if(e.target.closest("[data-add]"))
    return form("New step",[{label:"Step",name:"t"},{label:"Status",name:"s",opts:STATES,value:"open"},
      {label:"How it is checked",name:"check"},{label:"Proof / note",name:"p",area:1},
      {label:"Sub-steps (one per line)",name:"steps",area:1}],
      d=>api("item.add",{id:aid,t:d.t,s:d.s,check:d.check,p:d.p,steps:d.steps.split("\n")}));
  if(e.target.closest("[data-askedit]"))
    return form("Edit ask",[{label:"Title",name:"title",value:A.title||""},{label:"Where",name:"where",value:A.where||""},
      {label:"What was asked",name:"text",area:1,rows:5,value:A.text||""}],d=>api("ask.patch",{id:aid,...d}));
  if(e.target.closest("[data-askdel]")&&confirm("Delete this whole ask?")){await api("ask.delete",{id:aid});return load()}
});
document.addEventListener("change",async e=>{
  const s=e.target.closest("[data-set]"); if(!s)return;
  const li=e.target.closest("li[data-id]");
  try{await api("item.patch",{id:li.dataset.id,i:li.dataset.i,s:s.value});await load()}catch(err){alert(err.message)}
});
$("#newask").onclick=()=>form("New ask",[{label:"Title",name:"title"},{label:"Where",name:"where",value:"Docket"},
  {label:"What you want",name:"text",area:1,rows:4}],d=>api("ask.add",d));
$("#reload").onclick=load;
$("#q").oninput=draw; $("#sort").onchange=draw;
load();
</script>
